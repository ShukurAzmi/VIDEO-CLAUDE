<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a08; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0a08; }
      #bg-host, #ov-host, #pov-host, #sp-host, #cta-host { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #bg-host { z-index: 1; }
      #stage { position: absolute; left: 110px; top: 195px; width: 860px; height: 1529px; z-index: 2;
        border-radius: 44px; overflow: hidden; background: #000;
        box-shadow: 0 0 80px rgba(245,196,81,.35), 0 30px 90px rgba(0,0,0,.7); }
      #src { position: absolute; left: 0; top: 0; width: 860px; height: 1529px; object-fit: cover; }
      #ring { position: absolute; inset: 0; border-radius: 44px; border: 4px solid #F5C451; z-index: 3;
        box-shadow: inset 0 0 40px rgba(245,196,81,.25); pointer-events: none; }
      #ov-host { z-index: 4; } #pov-host { z-index: 5; } #sp-host { z-index: 6; } #cta-host { z-index: 7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.3" data-width="1080" data-height="1920">
      <div id="bg-host" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="40.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="stage">
        <video id="src" class="clip" src="assets/source.mp4" data-start="0" data-duration="36.5"
          data-track-index="2" data-has-audio="true" playsinline></video>
        <div id="ring"></div>
      </div>

      <div id="ov-host" data-composition-id="ov" data-composition-src="compositions/ov.html"
        data-start="0" data-duration="40.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="pov-host" data-composition-id="pov" data-composition-src="compositions/pov.html"
        data-start="0" data-duration="40.3" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sp-host" data-composition-id="sp" data-composition-src="compositions/sp.html"
        data-start="12.9" data-duration="2.9" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta-host" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="35.7" data-duration="4.6" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const FB = 1920 / 1529; // full-bleed scale of the card
      // 0-9s: natural, full-bleed, no frame
      gsap.set("#stage", { scale: FB, borderRadius: 0, boxShadow: "none" });
      gsap.set("#ring", { opacity: 0 });
      tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      // 9.0-9.9 pattern break: glitch shake while still full-bleed
      [[-16,7],[14,-9],[-12,-5],[9,7],[0,0]].forEach((p, i) => {
        tl.to("#stage", { x: p[0], y: p[1], duration: 0.1, ease: "power1.inOut" }, 9.0 + i * 0.1);
      });
      // 9.9: collapse into the framed gold card
      tl.to("#stage", { scale: 1, borderRadius: 44, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 9.9);
      tl.to("#stage", { boxShadow: "0 0 80px rgba(245,196,81,.35), 0 30px 90px rgba(0,0,0,.7)", duration: 0.5, ease: "power2.out", immediateRender: false }, 10.1);
      tl.to("#ring", { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 10.1);
      // 12.9-15.8 split screen: presenter drops into lower half
      tl.to("#stage", { scale: FB, y: 860, borderRadius: 0, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 12.9);
      tl.to("#ring", { opacity: 0, duration: 0.3, immediateRender: false }, 12.9);
      tl.to("#stage", { scale: 1, y: 0, borderRadius: 44, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 15.25);
      tl.to("#ring", { opacity: 1, duration: 0.4, immediateRender: false }, 15.4);
      // cuts: arrive slightly large, settle
      [18.0, 25.0, 29.0, 35.0].forEach((t) => {
        tl.fromTo("#stage", { scale: 1.035 }, { scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, t);
      });
      // exit for the call-out
      tl.to("#stage", { scale: 0.86, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in", immediateRender: false }, 35.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
