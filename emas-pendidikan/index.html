<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2)}
@font-face{font-family:Poppins;font-weight:900;src:url(fonts/poppins-latin-900-normal.woff2)}
@font-face{font-family:Lora;font-weight:600;src:url(fonts/lora-latin-600-normal.woff2)}
@font-face{font-family:Lora;font-weight:700;src:url(fonts/lora-latin-700-normal.woff2)}
@font-face{font-family:Lora;font-weight:600;font-style:italic;src:url(fonts/lora-latin-600-italic.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%);pointer-events:none}
#topshade{position:absolute;left:0;right:0;top:0;height:760px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0));pointer-events:none;opacity:0}
#title{position:absolute;left:90px;right:90px;top:300px;text-align:center;color:#fff;font-family:Poppins;pointer-events:none}
#title .l{display:block;line-height:1.15;text-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.6)}
#title .big{font-weight:900;font-size:76px;letter-spacing:1px;-webkit-text-stroke:3px #1b130b;paint-order:stroke fill}
#title .gold{font-weight:900;font-size:96px;color:#ffd75e;background:linear-gradient(#fff1b8,#f2be3a 55%,#c98a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
#title .red{font-weight:900;font-size:92px;color:#e23b3b;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
#title .sub{font-weight:700;font-size:48px;margin-top:14px}
#title .small{font-weight:600;font-size:30px;margin-top:12px;opacity:.85}
#title .quote{font-family:Lora;font-style:italic;font-weight:600;font-size:60px;line-height:1.3}
#title .brand{font-family:Lora;font-weight:700;font-size:70px;color:#c1121f;-webkit-text-stroke:2px #fff;paint-order:stroke fill;margin-top:8px}
#sub{position:absolute;left:70px;right:140px;top:1080px;text-align:center;font-family:Poppins;font-weight:800;font-size:68px;color:#fff;-webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.5)}
#sub b{color:#ffd75e}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#wm{position:absolute;left:72px;top:1196px;height:50px;z-index:5;pointer-events:none;opacity:.55}
</style></head>
<body><div id="stage">
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="vig"></div><div id="topshade"></div>
<div id="title"></div><div id="sub"></div>
<div id="fade"></div>
<img id="wm" src="assets/adila_gold_wm.png">
</div>

<script type="module" src="js/main.js"></script>
</body></html>
