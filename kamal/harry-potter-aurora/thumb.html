html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Mont,'Noto Color Emoji',sans-serif;color:#fff}

.pill{display:inline-block;background:rgba(20,14,5,.9);border:4px solid #E8B830;border-radius:60px;padding:14px 46px;font:900 54px Mont}
