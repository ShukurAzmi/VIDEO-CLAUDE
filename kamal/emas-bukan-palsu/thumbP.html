<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;src:url(fonts/mont800.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(fonts/mont900.woff2);font-weight:900}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Mont,'Noto Color Emoji',sans-serif;color:#fff}
#bg{position:absolute;inset:0;background-size:cover;background-position:50% 50%;filter:saturate(.9) contrast(1.05) brightness(1.03)}
#sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,2,.95) 0%,rgba(5,4,2,.75) 20%,rgba(5,4,2,0) 34%,rgba(5,4,2,0) 52%,rgba(5,4,2,.85) 63%,rgba(5,4,2,.97) 100%)}
.gold{background:linear-gradient(180deg,#FFF3B8 0%,#F5C542 45%,#C8901A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g{position:absolute;left:60px;right:140px;text-align:center;white-space:nowrap;filter:drop-shadow(0 8px 18px rgba(0,0,0,.9))}
.b{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,#FFF0B0,#F5C542 45%,#C8901A);border:8px solid #fff3c4;box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 60px rgba(245,197,66,.5);font-weight:900;color:#3a2600;vertical-align:middle}
.pill{display:inline-block;background:rgba(20,14,5,.92);border:4px solid #E8B830;border-radius:60px;padding:14px 44px;font:900 46px Mont}
.ph{position:absolute;border-radius:24px;overflow:hidden;border:6px solid #E8B830;box-shadow:0 18px 50px rgba(0,0,0,.75),0 0 40px rgba(245,197,66,.4)}
.ph img{width:100%;height:100%;object-fit:cover}
</style></head><body><div id="s"><div id="bg"></div><div id="sh"></div>
<div class="g" style="top:290px;font:900 64px Mont;color:#fff">MACAM MANA NAK TAHU</div>
<div class="g" style="top:375px"><span class="gold" style="font:900 150px Mont;letter-spacing:-2px">EMAS</span></div>
<div class="g" style="top:540px"><span style="display:inline-block;background:linear-gradient(160deg,#ff5a5a,#c81e1e);border:6px solid #fff;border-radius:22px;padding:4px 36px;font:900 104px Mont;transform:rotate(-4deg);box-shadow:0 12px 30px rgba(0,0,0,.6)">BUKAN PALSU?</span></div>
<div class="ph" style="left:650px;top:760px;width:280px;height:220px;transform:rotate(6deg)"><img src="img/bar.jpg"></div>
<div style="position:absolute;left:820px;top:900px;font-size:120px;transform:rotate(-12deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.8))">🔍</div>
<div class="g" style="top:1150px"><span class="b" style="width:170px;height:170px;font-size:110px;margin-right:22px;transform:rotate(-6deg)">3</span><span class="gold" style="font:900 100px Mont;vertical-align:middle">SOALAN</span></div>
<div class="g" style="top:1340px"><span style="font:900 72px Mont">WAJIB TANYA ✅</span></div>
<div class="g" style="top:1445px"><span class="pill">SEBELUM BELI EMAS</span></div>
</div></body></html>
