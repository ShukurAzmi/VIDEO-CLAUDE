<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(fonts/mont600.woff2);font-weight:600}
@font-face{font-family:Mont;src:url(fonts/mont800.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(fonts/mont900.woff2);font-weight:900}
@font-face{font-family:Play;src:url(fonts/play700.woff2);font-weight:700}
@font-face{font-family:Marker;src:url(fonts/marker.woff2)}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Mont,'Noto Color Emoji',sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#3a2a0c 0%,#140e05 45%,#050403 100%)}
#bgfx{position:absolute;inset:0;z-index:1;pointer-events:none}
#vbox{position:absolute;overflow:hidden;transform-origin:0 0}
#vbox img{position:absolute;left:0;top:0;width:1080px;height:1920px}
#vborder{position:absolute;pointer-events:none;border:5px solid #E8B830;box-shadow:0 0 40px rgba(245,197,66,.45),0 20px 60px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff6d8;opacity:0;pointer-events:none}
#g{position:absolute;inset:0}
#cap{position:absolute;left:60px;right:140px;top:1262px;height:110px;display:flex;justify-content:center;align-items:center;white-space:nowrap}
.g{position:absolute;transform-origin:50% 50%}
.gold{background:linear-gradient(180deg,#FFF0B0 0%,#F5C542 45%,#C8901A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh{filter:drop-shadow(0 6px 14px rgba(0,0,0,.85))}
.card{overflow:hidden;background:linear-gradient(160deg,rgba(28,20,8,.92),rgba(8,6,3,.92));border:3px solid #E8B830;border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(245,197,66,.12)}
.bar{background:linear-gradient(160deg,#FFF3B8 0%,#F5C542 30%,#D9A21F 60%,#FFE680 75%,#B8860B 100%);border-radius:10px;box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -5px 0 rgba(120,80,0,.5),0 8px 16px rgba(0,0,0,.5);color:#6b4a00;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.note{background:#FFE680;color:#2a1d00;font-family:Marker;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.55)}
</style></head><body>
<div id="stage">
  <div id="bg"></div><div id="bgfx"></div>
  <div id="vbox"><img id="v"></div><div id="vborder"></div>
  <div id="g"></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script src="comp.js"></script>
</body></html>
