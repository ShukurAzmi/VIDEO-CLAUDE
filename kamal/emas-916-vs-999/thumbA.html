<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;src:url(fonts/mont800.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(fonts/mont900.woff2);font-weight:900}
@font-face{font-family:Play;src:url(fonts/play700.woff2);font-weight:700}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Mont,'Noto Color Emoji',sans-serif;color:#fff}
#bg{position:absolute;inset:0;background-size:cover;background-position:var(--pos);filter:saturate(.92) contrast(1.04)}
#sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,2,.92) 0%,rgba(5,4,2,.4) 22%,rgba(5,4,2,0) 30%,rgba(5,4,2,0) 50%,rgba(5,4,2,.8) 64%,rgba(5,4,2,.95) 100%)}
.gold{background:linear-gradient(180deg,#FFF3B8 0%,#F5C542 45%,#C8901A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g{position:absolute;left:60px;right:140px;text-align:center;white-space:nowrap;filter:drop-shadow(0 8px 18px rgba(0,0,0,.9))}
.b{display:inline-flex;align-items:center;justify-content:center;width:300px;height:300px;border-radius:50%;background:linear-gradient(160deg,#FFF0B0,#F5C542 45%,#C8901A);border:8px solid #fff3c4;box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 60px rgba(245,197,66,.5);font:900 118px Mont;color:#3a2600;vertical-align:middle}
.pill{display:inline-block;background:rgba(20,14,5,.9);border:4px solid #E8B830;border-radius:60px;padding:14px 46px;font:900 54px Mont}
</style></head><body><div id="s"><div id="bg"></div><div id="sh"></div>

<div class="g" style="top:1200px"><span class="gold" style="font:900 96px Mont">ANDA?</span> <span style="font-size:88px">🤔</span></div>

</div></body></html>
